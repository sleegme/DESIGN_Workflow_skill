name: Publish v0.1.0 source tree

on:
  push:
    branches:
      - main
    paths:
      - .bootstrap/**
      - .github/workflows/bootstrap-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate release package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | base64 --decode > /tmp/design-workflow-v0.1.0.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/design-workflow-v0.1.0.zip') as archive:
              archive.extractall('/tmp/design-workflow-release')
          PY
          python /tmp/design-workflow-release/design-workflow/scripts/validate_skill.py /tmp/design-workflow-release/design-workflow
          python /tmp/design-workflow-release/design-workflow/scripts/test_routing_cases.py

      - name: Publish clean main branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release-v0.1.0
          git rm -rf .
          cp -a /tmp/design-workflow-release/design-workflow/. .
          git add -A
          git commit -m "feat: publish design-workflow v0.1.0"
          git push --force origin HEAD:main
