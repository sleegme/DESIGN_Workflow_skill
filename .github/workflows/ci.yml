name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q design-workflow/scripts scripts tests
      - name: Validate project invariants
        run: python scripts/validate_project.py
      - name: Validate official Agent Skills format
        run: agentskills validate design-workflow
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: Verify release archive
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic archive twice
        run: |
          python scripts/package_skill.py --version 0.2.0 --output-dir dist-a
          python scripts/package_skill.py --version 0.2.0 --output-dir dist-b
          cmp dist-a/design-workflow-0.2.0.zip dist-b/design-workflow-0.2.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: design-workflow-ci-package
          path: |
            dist-a/design-workflow-0.2.0.zip
            dist-a/design-workflow-0.2.0.zip.sha256
          if-no-files-found: error
