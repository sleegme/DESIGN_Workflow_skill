name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validation scripts
        run: python -m compileall -q scripts
      - name: Validate Agent Skill package
        run: python scripts/validate_skill.py .
      - name: Validate routing test matrix
        run: python scripts/test_routing_cases.py
